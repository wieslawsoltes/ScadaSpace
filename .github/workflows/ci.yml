name: Validate
on:
  push:
    branches: [main, feat/perspective-workbench]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build reusable engines
        run: |
          dotnet build src/ScadaSpace.Runtime -c Release
          dotnet build src/ScadaSpace.Designer -c Release
          dotnet build src/ScadaSpace.Persistence -c Release
