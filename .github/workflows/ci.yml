name: Validate
on:
  push:
    branches: [main, feat/perspective-workbench]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build reusable engines and renderer
        run: |
          dotnet build src/ScadaSpace.Runtime -c Release
          dotnet build src/ScadaSpace.Designer -c Release
          dotnet build src/ScadaSpace.Persistence -c Release
          dotnet build src/ScadaSpace.Layout -c Release
          dotnet build src/ScadaSpace.Graphics -c Release
      - name: Run deterministic engine regressions
        run: dotnet run --project tests/ScadaSpace.Tests -c Release
      - name: Archive exact source tree
        if: always()
        run: |
          mkdir -p artifacts
          git archive --format=zip --output=artifacts/ScadaSpace-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-results-and-source
          path: |
            TestResults
            artifacts/ScadaSpace-source.zip
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet workload install wasm-tools
      - name: Publish Uno WebAssembly application
        run: dotnet publish src/ScadaSpace.App -f net10.0-browserwasm -c Release -o artifacts/browser
      - name: Install pinned browser test tooling
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Validate the actual browser application
        run: |
          mkdir -p artifacts/site
          ln -s "$PWD/artifacts/browser/wwwroot" artifacts/site/ScadaSpace
          python -m http.server 8765 --bind 127.0.0.1 --directory artifacts/site > artifacts/server.log 2>&1 &
          python tests/browser/smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-validation
          path: |
            TestResults/browser
            artifacts/server.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-app
          path: artifacts/browser
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build desktop application
        run: dotnet build src/ScadaSpace.App -f net10.0-desktop -c Release
